services:
  - type: web
    name: shoe-haven
    runtime: php
    plan: free
    buildCommand: >
      composer install --no-dev --optimize-autoloader &&
      npm ci &&
      npm run build
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    preDeployCommand: bash deploy.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://shoe-haven.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: shoe-haven-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: shoe-haven-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: shoe-haven-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: shoe-haven-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shoe-haven-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: MAIL_MAILER
        value: log

databases:
  - name: shoe-haven-db
    plan: free
    databaseName: shoe_haven
